}}\" onClick=\"{{goInicio}}\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"/><\/svg>Início<\/button>\n<button class=\"navbtn\" style=\"color: {{nav.mapa}}\" onClick=\"{{goMapa}}\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z M9 4v14 M15 6v14\"/><\/svg>Mapa<\/button>\n<button class=\"navbtn\" style=\"color: {{nav.horarios}}\" onClick=\"{{goHorarios}}\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/><\/svg>Horários<\/button>\n<button class=\"navbtn\" style=\"color: {{nav.reportar}}\" onClick=\"{{goReportar}}\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9 16H3z M12 10v4 M12 17v.5\"/><\/svg>Reportar<\/button>\n<button class=\"navbtn\" style=\"color: {{nav.eco}}\" onClick=\"{{goEco}}\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/><\/svg>Ecopontos<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{banner}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; left: 10px; right: 10px; top: 10px; background: rgba(250,250,250,0.98); border-radius: 18px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); display: flex; gap: 12px; align-items: flex-start\">\n<div style=\"width: 36px; height: 36px; border-radius: 10px; background: #1E7A4C; flex: none; display: flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h11v10H3z M14 9h4l3 3v4h-7\"/><circle cx=\"7\" cy=\"18\" r=\"1.6\"/><circle cx=\"17\" cy=\"18\" r=\"1.6\"/><\/svg><\/div>\n<div><div style=\"font-size: 12px; color: #5B6B62; font-weight: 600\">COLETA AVISO · agora<\/div><div style=\"font-weight: 800; font-size: 15px\">O caminhão está chegando<\/div><div style=\"font-size: 14px; color: #33433B\">Está a cerca de {{raio}} m. Coloque o lixo para fora.<\/div><\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n",defaults:{"videoSeconds": 30},factory:function(DCLogic){
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cidade: null, busca: '', screen: 'login', tab: 'inicio', vLeft: 30, s: 380, heading: 90, notified: false, banner: false, raio: 500, report: null, sent: false, zi: 2, follow: true, cam: [400, 400], dragging: false, hint: true };
  }
  componentDidMount() { this.timer = setInterval(() => this.tick(), 500); }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.bt); }
  route() { return [[60, 80], [300, 80], [300, 260], [460, 260], [460, 380], [700, 380], [700, 500], [600, 500]]; }
  total() { return 1160; }
  homeS() { return 840; }
  zooms() { return [0.55, 0.75, 1, 1.35, 1.8, 2.4]; }
  walk(s) {
    const r = this.route();
    const pts = [r[0]];
    let left = s;
    for (let i = 0; i < r.length - 1; i++) {
      const a = r[i], b = r[i + 1];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (left <= L) {
        const k = left / L;
        const p = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
        pts.push(p);
        return { pts, p, seg: i, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI };
      }
      pts.push(b);
      left -= L;
    }
    const n = r.length;
    return { pts, p: r[n - 1], seg: n - 2, ang: Math.atan2(r[n - 1][1] - r[n - 2][1], r[n - 1][0] - r[n - 2][0]) * 180 / Math.PI };
  }
  rest(s) {
    const r = this.route();
    const w = this.walk(s);
    return [w.p].concat(r.slice(w.seg + 1));
  }
  dist(p) { return Math.hypot(p[0] - 600, p[1] - 398) * 3; }
  center() {
    const st = this.state;
    const c = st.follow ? this.walk(st.s).p : st.cam;
    const z = this.zooms().at(st.zi);
    const cl = (v, half) => (half * 2 >= 800 ? 400 : Math.max(half, Math.min(800 - half, v)));
    return [cl(c[0], 195 / z), cl(c[1], 240 / z)];
  }
  tick() {
    const st = this.state;
    const patch = {};
    if (st.screen === 'app') {
      let s = st.s + 4;
      let notified = st.notified;
      if (s > this.total()) { s = 0; notified = false; }
      const w = this.walk(s);
      const target = w.ang + 90;
      const diff = ((target - st.heading) % 360 + 540) % 360 - 180;
      patch.heading = st.heading + diff;
      const d = this.dist(w.p);
      if (!notified && s < this.homeS() && d <= st.raio) {
        notified = true;
        patch.banner = true;
        clearTimeout(this.bt);
        this.bt = setTimeout(() => this.setState({ banner: false }), 4500);
      }
      patch.s = s;
      patch.notified = notified;
    }
    this.setState(patch);
  }
  renderVals() {
    const st = this.state;
    const vd = Number(this.props.videoSeconds ?? 30);
    const w = this.walk(st.s);
    const p = w.p;
    const d = this.dist(p);
    const before = st.s < this.homeS();
    const distLabel = d >= 1000 ? (d / 1000).toFixed(1).replace('.', ',') + ' km' : (Math.round(d / 10) * 10) + ' m';
    const eta = Math.max(1, Math.round(((this.homeS() - st.s) * 3) / 167));
    const status = !before ? 'passou' : (d <= st.raio ? 'chegando' : 'caminho');
    const st3 = { caminho: ['A caminho', '#E6EEF8', '#1D4F8C'], chegando: ['Chegando', '#E3F1E8', '#17633D'], passou: ['Já passou', '#EEF0EF', '#3F4C46'] }[status];
    const titles = { inicio: 'Olá, Maria', mapa: 'Caminhão ao vivo', horarios: 'Dias e horários', reportar: 'Reportar', eco: 'Ecopontos' };
    const navc = (k) => (st.tab === k ? '#1E7A4C' : '#5B6B62');
    const go = (k) => () => this.setState({ tab: k, report: null, sent: false, follow: k === 'mapa' ? true : st.follow });
    const sem = [['Segunda', '07h–11h'], ['Terça', '—'], ['Quarta', '—'], ['Quinta', '07h–11h'], ['Sexta', '—'], ['Sábado', '07h–11h'], ['Domingo', '—']];
    const z = this.zooms().at(st.zi);
    const c = this.center();
    const VW = 195, VH = 240;
    const pt = (q) => q[0].toFixed(1) + ',' + q[1].toFixed(1);
    const clamp = (v) => Math.max(0, Math.min(800, v));
    const lista = [
      { id: 'sbc', nome: 'São Bernardo do Campo', uf: 'SP', sigla: 'SBC', cor: '#1D4F8C', ok: true },
      { id: 'sa', nome: 'Santo André', uf: 'SP', sigla: 'SA', cor: '#7A1F2B', ok: false },
      { id: 'scs', nome: 'São Caetano do Sul', uf: 'SP', sigla: 'SCS', cor: '#0E6B5C', ok: false },
      { id: 'dia', nome: 'Diadema', uf: 'SP', sigla: 'D', cor: '#5B3FA0', ok: false },
      { id: 'maua', nome: 'Mauá', uf: 'SP', sigla: 'M', cor: '#A04D08', ok: false }
    ];
    const norm = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const fsize = (sig) => (sig.length > 2 ? 10 : 12);
    const filtradas = lista.filter((c) => norm(c.nome).includes(norm(st.busca)));
    const escolhida = lista.find((c) => c.id === st.cidade) || lista.at(0);
    return {
      isLogin: st.screen === 'login', isCidade: st.screen === 'cidade', isVideo: st.screen === 'video', isApp: st.screen === 'app',
      login: () => this.setState({ screen: 'cidade' }),
      busca: st.busca,
      onBusca: (e) => this.setState({ busca: e.target.value }),
      cidades: filtradas.map((c) => {
        const on = st.cidade === c.id;
        return {
          nome: c.nome, uf: c.uf, sigla: c.sigla, cor: c.cor, fs: fsize(c.sigla), indisp: !c.ok,
          st: c.ok ? 'Disponível' : 'Em breve', stCor: c.ok ? '#17633D' : '#5B6B62', op: c.ok ? 1 : 0.6,
          bg: on ? '#E3F1E8' : '#fff', border: on ? '2px solid #1E7A4C' : '1px solid #D5DDD8',
          ring: on ? '#1E7A4C' : '#9AA8A0', dot: on ? '#1E7A4C' : 'transparent',
          pick: () => { if (c.ok) this.setState({ cidade: c.id }); }
        };
      }),
      semCidade: filtradas.length === 0,
      cidadeOk: !!st.cidade, cidadeNone: !st.cidade,
      cid: { nome: escolhida.nome, sigla: escolhida.sigla, cor: escolhida.cor, fs: fsize(escolhida.sigla) },
      confirmCidade: () => { if (this.state.cidade) this.setState({ screen: 'video', vPlayed: 0, som: false }); },
      enter: () => { if (this.vid) this.vid.pause(); this.setState({ screen: 'app', tab: 'inicio' }); },
      videoSrc: 'video.mp4',
      videoPoster: 'video-poster.jpg',
      setVid: (el) => {
        if (el && el !== this.vid) {
          this.vid = el;
          el.muted = true;
          const p = el.play();
          if (p && p.catch) p.catch(() => {});
        }
        if (!el) this.vid = null;
      },
      onVidTime: (e) => {
        const t = e.currentTarget.currentTime || 0;
        if (t > (this.state.vPlayed || 0) + 0.2) this.setState({ vPlayed: t });
      },
      onVidEnd: () => this.setState({ vPlayed: Math.max(vd, this.state.vPlayed || 0) }),
      onVidErr: () => this.setState({ vPlayed: vd }),
      somMudo: !st.som, somLigado: !!st.som,
      somLabel: st.som ? 'Desligar som' : 'Ativar som',
      toggleSom: () => {
        const on = !this.state.som;
        if (this.vid) {
          this.vid.muted = !on;
          const p = this.vid.play();
          if (p && p.catch) p.catch(() => {});
        }
        this.setState({ som: on });
      },
      videoPct: Math.min(100, Math.round(((st.vPlayed || 0) / vd) * 100)),
      videoMsg: (st.vPlayed || 0) < vd ? 'Você poderá continuar em ' + Math.ceil(vd - (st.vPlayed || 0)) + ' s' : 'Obrigado por assistir.',
      videoDone: (st.vPlayed || 0) >= vd, videoRunning: (st.vPlayed || 0) < vd,
      title: titles[st.tab],
      tabInicio: st.tab === 'inicio', tabMapa: st.tab === 'mapa', tabHorarios: st.tab === 'horarios', tabReportar: st.tab === 'reportar', tabEco: st.tab === 'eco',
      goInicio: go('inicio'), goMapa: go('mapa'), goHorarios: go('horarios'), goReportar: go('reportar'), goEco: go('eco'),
      nav: { inicio: navc('inicio'), mapa: navc('mapa'), horarios: navc('horarios'), reportar: navc('reportar'), eco: navc('eco') },
      statusLabel: st3[0], statusBg: st3[1], statusFg: st3[2],
      distLabel: before ? distLabel : '—',
      bigLabel: before ? distLabel : 'Coleta feita',
      etaLabel: before ? 'chega em cerca de ' + eta + ' min' : 'passou na sua rua hoje',
      etaShort: before ? '~' + eta + ' min' : 'Concluída',
      chipText: before ? 'Chega em ~' + eta + ' min · ' + distLabel : 'Coleta feita na sua rua',
      z, wx: (VW - c[0] * z).toFixed(1), wy: (VH - c[1] * z).toFixed(1),
      tx: ((p[0] - c[0]) * z + VW).toFixed(1), ty: ((p[1] - c[1]) * z + VH).toFixed(1),
      hx: ((600 - c[0]) * z + VW).toFixed(1), hy: ((398 - c[1]) * z + VH).toFixed(1),
      heading: st.heading.toFixed(1),
      tr: st.dragging ? 'none' : 'transform 0.5s linear',
      cursor: st.dragging ? 'grabbing' : 'grab',
      donePts: w.pts.map(pt).join(' '),
      restPts: this.rest(st.s).map(pt).join(' '),
      raioR: (st.raio / 3).toFixed(1),
      scaleW: Math.round((200 / 3) * z),
      recBg: st.follow ? '#fff' : '#1E7A4C', recFg: st.follow ? '#1E7A4C' : '#fff',
      showHint: st.hint && st.tab === 'mapa',
      zoomIn: () => this.setState({ zi: Math.min(this.zooms().length - 1, this.state.zi + 1) }),
      zoomOut: () => this.setState({ zi: Math.max(0, this.state.zi - 1) }),
      recenter: () => this.setState({ follow: true }),
      showHome: () => this.setState({ follow: false, cam: [600, 398] }),
      down: (e) => {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}

      },
      move: (e) => {
        if (!this.drag) return;
        const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
        if (!this.drag.moved && Math.hypot(dx, dy) < 4) return;
        this.drag.moved = true;
        const zz = this.zooms().at(this.state.zi);
        this.setState({ follow: false, dragging: true, hint: false, cam: [clamp(this.drag.cx - dx / zz), clamp(this.drag.cy - dy / zz)] });
      },
      up: () => { this.drag = null; if (this.state.dragging) this.setState({ dragging: false }); },
      raio: st.raio,
      banner: st.banner,
      proximas: [['Hoje, quinta 22/10', '07h–11h'], ['Sábado, 24/10', '07h–11h'], ['Segunda, 26/10', '07h–11h']].map((x, i, a) => ({ dia: x[0], hora: x[1], border: i < a.length - 1 ? '1px solid #EEF1EF' : '0' })),
      semana: sem.map((x, i) => ({ dia: x[0], hora: x[1], cor: x[1] === '—' ? '#8A968F' : '#15231C', border: i < sem.length - 1 ? '1px solid #EEF1EF' : '0' })),
      raios: [300, 500, 1000].map((r) => ({ label: r === 1000 ? '1 km' : r + ' m', pick: () => this.setState({ raio: r, notified: false }), bg: st.raio === r ? '#1E7A4C' : '#fff', fg: st.raio === r ? '#fff' : '#15231C', border: st.raio === r ? '1px solid #1E7A4C' : '1px solid #D5DDD8' })),
      repHome: !st.report && !st.sent, repNao: st.report === 'nao' && !st.sent, repDesc: st.report === 'descarte' && !st.sent, repSent: st.sent,
      chooseNao: () => this.setState({ report: 'nao' }),
      chooseDescarte: () => this.setState({ report: 'descarte' }),
      confirm: () => this.setState({ sent: true }),
      resetRep: () => this.setState({ report: null, sent: false }),
      ecopontos: [
        { nome: 'Ecoponto Centro', dist: '1,2 km', end: '[ENDEREÇO]', horario: 'seg a sáb, 8h–17h', mats: ['Entulho', 'Móveis', 'Poda', 'Recicláveis'] },
        { nome: 'Ecoponto Vila Nova', dist: '2,8 km', end: '[ENDEREÇO]', horario: 'seg a sáb, 8h–17h', mats: ['Entulho', 'Eletrônicos', 'Óleo de cozinha'] },
        { nome: 'Ecoponto Jardim', dist: '4,1 km', end: '[ENDEREÇO]', horario: 'ter a dom, 8h–16h', mats: ['Móveis', 'Poda', 'Pneus'] }
      ]
    };
  }
}

{file:"Motorista.dc.html",title:"App do motorista",phone:true,helmet:"\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap\">\n<style>\nbody{margin:0}\na{color:#1E7A4C}a:hover{color:#17633D}\n.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:16px;border:1px solid #CBD5CF;background:#fff;color:#15231C;font:800 17px Manrope,system-ui,sans-serif;cursor:pointer;width:100%;box-sizing:border-box;padding:0 16px}\n.btn-primary{background:#1E7A4C;border-color:#1E7A4C;color:#fff}\n.btn-danger{background:#B3261E;border-color:#B3261E;color:#fff}\n.card{background:#fff;border:1px solid #E2E8E4;border-radius:18px;padding:16px;box-sizing:border-box}\n.muted{color:#5B6B62}\n.key{height:64px;border-radius:16px;border:0;background:#fff;font:700 24px Manrope,system-ui,sans-serif;color:#15231C;cursor:pointer}\n.stat{flex:1;background:#fff;border:1px solid #E2E8E4;border-radius:14px;padding:10px 12px}\n.mapbtn{width:46px;height:46px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#15231C}\n@keyframes halo{0%{transform:scale(0.55);opacity:0.75}100%{transform:scale(1.6);opacity:0}}\n<\/style>\n",template:"\n\n<div style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF2EF; font-family: Manrope, system-ui, sans-serif; color: #15231C; display: flex; flex-direction: column\">\n\n<div style=\"background: #15231C; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; gap: 10px; align-items: center\">\n<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7FD3A7\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h11v10H3z M14 9h4l3 3v4h-7\"/><circle cx=\"7\" cy=\"18\" r=\"1.6\"/><circle cx=\"17\" cy=\"18\" r=\"1.6\"/><\/svg>\n<span style=\"font-weight: 800\" : space-between\"><span class=\"muted\">Posições enviadas<\/span><span style=\"font-weight: 800\">{{pts}}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between\"><span class=\"muted\">Ocorrências<\/span><span style=\"font-weight: 800\">{{ocCount}}<\/span><\/div>\n<\/div>\n<div style=\"flex: 1\"><\/div>\n<button class=\"btn btn-primary\" onClick=\"{{backEscala}}\">Voltar à escala<\/button>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ocOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; background: rgba(10,20,15,0.5); display: flex; align-items: flex-end\">\n<div style=\"background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box\">\n<div style=\"font-size: 20px; font-weight: 800; margin-bottom: 4px\">Registrar ocorrência<\/div>\n<sc-for list=\"{{ocorrencias}}\" as=\"o\" hint-placeholder-count=\"4\"><button class=\"btn\" style=\"justify-content: flex-start\" onClick=\"{{o.pick}}\">{{o.label}}<\/button><\/sc-for>\n<button class=\"btn\" style=\"border: 0; color: #5B6B62\" onClick=\"{{closeOc}}\">Cancelar<\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n",defaults:{},factory:function(DCLogic){
class Component extends DCLogic {
  constructor(props) {

  }

  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.tt); }
  route() { return [[60, 80], [300, 80], [300, 260], [460, 260], [460, 380], [700, 380], [700, 500], [600, 500]]; }
  ruas() { return ['R. Marechal Deodoro', 'Av. Central', 'R. São Paulo', 'R. Jurubatuba', 'R. das Flores', 'Av. do Trabalho', 'R. Bahia']; }
  zooms() { return [0.55, 0.8, 1.15, 1.6, 2.2]; }
  walk(s) {
    const r = this.route();
    const pts = [r[0]];
    let left = s;
    for (let i = 0; i < r.length - 1; i++) {
      const a = r[i], b = r[i + 1];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (left <= L) {
        const k = left / L;
        const p = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
        pts.push(p);
        return { pts, p, seg: i, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI };
      }
      pts.push(b);
      left -= L;
    }
    const n = r.length;
    return { pts, p: r[n - 1], seg: n - 2, ang: Math.atan2(r[n - 1][1] - r[n - 2][1], r[n - 1][0] - r[n - 2][0]) * 180 / Math.PI };
  }
  center() {

    return [cl(c[0], 175 / z), cl(c[1], 165 / z)];
  }
  tick() {

    const s = Math.min(1160, st.s + 5);

    const pin = (st.pin + k).slice(0, 4);
    this.setState({ pin });
    if (pin.length === 4) setTimeout(() => this.setState({ screen: 'veiculo', pin: '', veic: null }), 250);
  }
  renderVals() {
    const st = this.state;
    const wk = this.walk(st.s);
    const rr = this.route();
    const pt = (q) => q[0].toFixed(1) + ',' + q[1].toFixed(1);
    const cc = this.center();
    const zz = this.zooms().at(st.zi);
    let turn;
    if (wk.seg < rr.length - 2 && st.s < 1160) {
      const a = rr.at(wk.seg), b = rr.at(wk.seg + 1), c = rr.at(wk.seg + 2);
      const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      const dm = Math.max(10, Math.round((Math.hypot(b[0] - wk.p[0], b[1] - wk.p[1]) * 3) / 10) * 10);
      const dir = cross > 0 ? 'direita' : 'esquerda';
      turn = { dir, text: 'Em ' + dm + ' m, vire à ' + dir, sub: this.ruas().at(wk.seg + 1) };
    } else {
      const dm = Math.round((Math.hypot(rr.at(-1)[0] - wk.p[0], rr.at(-1)[1] - wk.p[1]) * 3) / 10) * 10;
      turn = { dir: 'fim', text: dm > 0 ? 'Fim da rota em ' + dm + ' m' : 'Rota concluída', sub: 'Encerre a coleta ao chegar' };
    }
    const two = (n) => String(n).padStart(2, '0');
    const tempo = two(Math.floor(st.sec / 3600)) + ':' + two(Math.floor(st.sec / 60) % 60) + ':' + two(st.sec % 60);
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'limpar', '0', 'apagar'];
    const avisos = Math.min(1284, Math.round(st.s * 2.3));
    const coleta = st.screen === 'coleta';
    const frota = [
      { id: 'CL-03', placa: 'DEF2G34', tipo: 'Compactador 15 m³', st: 'Disponível', ok: true },
      { id: 'CL-05', placa: 'GHI3J45', tipo: 'Compactador 15 m³', st: 'Em uso · Rita S.', ok: false },
      { id: 'CL-07', placa: 'ABC1D23', tipo: 'Compactador 15 m³', st: 'Disponível', ok: true },
      { id: 'CL-09', placa: 'JKL4M56', tipo: 'Compactador 19 m³', st: 'Disponível', ok: true },
      { id: 'CL-12', placa: 'PQR6S78', tipo: 'Basculante 6 m³', st: 'Manutenção', ok: false }
    ];
    const cur = frota.find((v) => v.id === st.veic);
    return {
      isPin: st.screen === 'pin', isVeiculo: st.screen === 'veiculo', isEscala: st.screen === 'escala', isColeta: coleta, isResumo: st.screen === 'resumo',
      veiculos: frota.map((v) => {
        const on = st.veic === v.id;
        return {
          id: v.id, placa: v.placa, tipo: v.tipo, st: v.st, indisp: !v.ok,
          stCor: v.ok ? '#17633D' : '#8A4207', op: v.ok ? 1 : 0.55,
          bg: on ? '#E3F1E8' : '#fff', border: on ? '2px solid #1E7A4C' : '1px solid #D5DDD8',
          ring: on ? '#1E7A4C' : '#9AA8A0', dot: on ? '#1E7A4C' : 'transparent',
          pick: () => { if (v.ok) this.setState({ veic: v.id }); }
        };
      }),
      veicOk: !!cur, veicNone: !cur, veicId: cur ? cur.id : '',
      confirmVeic: () => { if (this.state.veic) this.setState({ screen: 'escala' }); },
      trocar: () => this.setState({ screen: 'veiculo' }),
      veicLabel: cur ? cur.id + ' · ' + cur.placa : '—', veicTipo: cur ? cur.tipo : '—',
      gpsLabel: coleta ? 'GPS OK · enviando' : 'GPS pronto',
      gpsColor: coleta ? '#7FD3A7' : '#C9D6CE',
      dots: [0, 1, 2, 3].map((i) => ({ bg: i < st.pin.length ? '#15231C' : 'transparent' })),
      keys: keys.map((k) => ({ label: k === 'apagar' ? '⌫' : (k === 'limpar' ? 'Limpar' : k), aria: k, size: k.length > 1 ? '15px' : '24px', press: () => this.press(k) })),
      start: () => this.setState({ screen: 'coleta', sec: 0, km: 0, pts: 0, s: 0, heading: 90, follow: true, ocCount: 0 }),
      logout: () => this.setState({ screen: 'pin', pin: '', veic: null }),
      finish: () => this.setState({ screen: 'resumo' }),
      backEscala: () => this.setState({ screen: 'escala' }),
      tempo,
      km: st.km.toFixed(1).replace('.', ','),
      pts: st.pts * 2,
      avisos,
      progresso: Math.round((st.s / 1160) * 100),
      doneLine: wk.pts.map(pt).join(' '),
      restLine: [wk.p].concat(rr.slice(wk.seg + 1)).map(pt).join(' '),
      z: zz, wx: (175 - cc[0] * zz).toFixed(1), wy: (165 - cc[1] * zz).toFixed(1),
      tx: ((wk.p[0] - cc[0]) * zz + 175).toFixed(1), ty: ((wk.p[1] - cc[1]) * zz + 165).toFixed(1),
      heading: st.heading.toFixed(1),
      tr: st.dragging ? 'none' : 'transform 1s linear',
      cursor: st.dragging ? 'grabbing' : 'grab',
      recBg: st.follow ? '#fff' : '#1D5FA8', recFg: st.follow ? '#1D5FA8' : '#fff',
      zoomIn: () => this.setState({ zi: Math.min(this.zooms().length - 1, this.state.zi + 1) }),
      zoomOut: () => this.setState({ zi: Math.max(0, this.state.zi - 1) }),
      recenter: () => this.setState({ follow: true }),

      move: (e) => {

      turnRight: turn.dir === 'direita', turnLeft: turn.dir === 'esquerda', turnEnd: turn.dir === 'fim',
      turnText: turn.text, turnSub: turn.sub,
      ocOpen: st.oc, ocCount: st.ocCount,

      ocorrencias: ['Caminhão quebrado', 'Via bloqueada', 'Rua inacessível', 'Caminhão cheio, indo descarregar'].map((label) => ({
        label,
        pick: () => {
          this.setState({ oc: false, ocCount: this.state.ocCount + 1, toast: label });

        }
      })),
      toast: !!st.toast, toastText: st.toast
    };
  }
}

{file:"Backoffice.dc.html",title:"Backoffice",phone:false,helmet:"\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap\">\n<style>\nbody{margin:0}\na{color:#1E7A4C}a:hover{color:#17633D}\n.navi{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:none;font:600 14px Manrope,system-ui,sans-serif;cursor:pointer;text-align:left;box-sizing:border-box}\n.panel{background:#fff;border:1px solid #E1E7E3;border-radius:16px;padding:18px;box-sizing:border-box;min-width:0}\n.ptitle{font-size:15px;font-weight:800;margin:0 0 12px}\n.muted{color:#56665D}\n.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}\n.tblbox{overflow-x:auto}\n.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}\n.tbl th{text-align:left;font-size:12px;font-weight:700;color:#56665D;padding:10px 12px;border-bottom:1px solid #E1E7E3;white-space:nowrap}\n.tbl td{padding:12px;border-bottom:1px solid #EEF2EF;white-space:nowrap}\n.bbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid #CBD5CF;background:#fff;font:700 14px Manrope,system-ui,sans-serif;color:#15231C;cursor:pointer}\n.bbtn-primary{background:#1E7A4C;border-color:#1E7A4C;color:#fff}\n.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}\n.field input,.field textarea{border:1px solid #CBD5CF;border-radius:10px;padding:10px 12px;font:500 14px Manrope,system-ui,sans-serif;color:#15231C}\n.mapbtn{width:44px;height:44px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#15231C}\n@keyframes halo{0%{transform:scale(0.55);opacity:0.75}100%{transform:scale(1.6);opacity:0}}\n@media (max-width: 820px){.bo-nav{max-width:none!important;flex-direction:row!im
